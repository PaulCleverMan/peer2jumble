[project]
name = "peer2jumble"
version = "0.1.0"
description = "peer2jumble"
requires-python = ">=3.13,<3.14"
readme = "README.md"
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    "django (>=6.0.3,<7.0.0)",
    "celery (>=5.6.2,<6.0.0)",
    "redis (>=7.3.0,<8.0.0)",
    "psycopg[binary] (>=3.3.3,<4.0.0)",
    "flower (>=2.0.1,<3.0.0)",
    "djangorestframework (>=3.16.1,<4.0.0)",
    "django-filter (>=25.2,<26.0)",
]

[dependency-groups]
dev = [
    "django-debug-toolbar (>=6.2.0,<7.0.0)"
]
